#version: "3.8"

networks:
  redisn:
    driver: bridge
  trafico-network:
    driver: bridge

services:
  # Servicio para el recolector de datos de Waze
  waze-data-collector:
    build: ./waze-data-collector
    container_name: waze-data-collector
    networks:
      - redisn
      #- trafico-network
    volumes:
      - ./waze-data-collector:/app      
    restart: "no"  # No reiniciar automáticamente, solo ejecutar una vez

  # Servicio para MongoDB
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - mongo_data:/data/db
    networks:
      - redisn

  mongo-exporter:
    build: ./mongo-exporter
    container_name: mongo_exporter
    networks:
      - redisn
    depends_on:
      - mongo
    volumes:
      - ./data-storage/data:/data
    environment:
      - MONGO_HOST=mongo
      - MONGO_DB=waze_db
      - MONGO_COLLECTION=eventos
      - MONGO_USER=admin
      - MONGO_PASS=admin

  # Servicio para la interfaz de administración de MongoDB
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: mongo
    networks:
      - redisn
    depends_on:
      - mongo
      - waze-data-collector

  # Servicio para Redis
  redis:
    image: bitnami/redis:latest
    restart: always
    container_name: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_EXTRA_FLAGS=--maxmemory 2mb --maxmemory-policy allkeys-random
    ports:
      - "6379:6379"
    volumes:
      - redis_data_1:/bitnami/redis/data
    networks:
      - redisn
    depends_on:
      - mongo
      - waze-data-collector

  # Filtro con Pig
  pig-filter:
    build: ./pig-filter
    platform: linux/amd64
    container_name: pig-filter
    volumes:
      - ./data-storage/data:/data
      - ./pig-filter:/scripts
  
    networks:
      - redisn
    depends_on:
      - mongo
      - waze-data-collector
      - mongo-exporter

  # Servicio para la interfaz de administración de Redis
  redis-admin:
    image: redislabs/redisinsight:latest
    restart: always
    container_name: redis-admin
    volumes:
      - redis-insight:/data
    ports:
      - "5540:5540"
    networks:
      - redisn
    depends_on:
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - trafico-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'You Know, for Search'"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - trafico-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601 | grep -q '<title>Kibana</title>'"]
      interval: 10s
      timeout: 10s
      retries: 120


  

  # Servicio para el sistema de caché
  query-cache:
    build: ./query-cache
    container_name: query-cache
    restart: "no"
    ports:
      - "5000:5000"
    networks:
      - redisn
    volumes:
      - ./query-cache:/usr/src/app
    depends_on:
      - redis
      - mongo  
      - pig-filter

  csv_loader_elastic:
    build: ./csv-loader-elastic
    container_name: csv_loader_elastic
    networks:
      - trafico-network
    depends_on:
      kibana:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./data-storage/data:/data
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_INDEX_1=raw_data
      - ES_INDEX_2=processed_data
      - CSV_PATH_1=/data/eventos_waze.csv
    restart: "no"

  csv-loader-filtered:
    build: ./csv-loader-elastic
    container_name: csv_loader_filtered
    networks:
      - trafico-network
    depends_on:
      kibana:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./data-storage/data:/data
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_INDEX_1=filtered_data
      - CSV_PATH_1=/data/eventos_filtrados/part-r-00000
    command: python load_csv.py
    restart: "no"
    

volumes:
  mongo_data:
    driver: local
  redis_data_1:
    driver: local
  redis-insight:
  esdata:
    driver: local


